<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Contagio</title>
    <meta name="description" content="Juego de cartas por turnos: reune cuatro organos sanos antes que tus rivales." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23C8443C'/><g stroke='%23C8443C' stroke-width='3' stroke-linecap='round'><path d='M16 2v5M16 25v5M2 16h5M25 16h5M6 6l3.5 3.5M22.5 22.5L26 26M26 6l-3.5 3.5M9.5 22.5L6 26'/></g></svg>" />
    <meta name="theme-color" content="#eef1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101715" media="(prefers-color-scheme: dark)" />
    <script>
      /* El tema se resuelve antes del primer pintado: si no, la pagina asoma
         en claro y parpadea al montar React. Misma clave que src/theme.ts. */
      (function () {
        try {
          var choice = localStorage.getItem('contagio.theme');
          var dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var lang = localStorage.getItem('contagio.lang');
          if (lang !== 'es' && lang !== 'en') lang = /^es/i.test(navigator.language || '') ? 'es' : 'en';
          document.documentElement.lang = lang;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
